name: DrawingCompare H5 synthetic pretest

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  pretest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy opencv-python-headless pymupdf pytest openpyxl

      - name: Compile all Python modules
        run: python -m compileall -q .

      - name: Run unit synthetic tests
        run: python -m pytest -q tests/test_change_detector_synthetic.py

      - name: Run PDF integration pretest
        run: python -m pytest -q tests/test_synthetic_pdf_integration.py
