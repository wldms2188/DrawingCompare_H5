name: DrawingCompare H5 synthetic regression

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  synthetic-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install pytest numpy opencv-python-headless==4.10.0.84 PyMuPDF reportlab openpyxl pillow
      - name: Run synthetic regression
        run: python -m pytest -q tests/test_synthetic_compare.py tests/test_multipage_pipeline.py
